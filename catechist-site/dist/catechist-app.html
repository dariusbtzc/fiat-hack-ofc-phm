    <style>
/* Design tokens (light + dark), components, then the desktop layout (min-width:900px) at the bottom. */
:root {
  --pri: #1e3a6e;
  --soft: #e6ecf6;
  --bg: #f5f6fa;
  --card: #fff;
  --bd: #e3e6ee;
  --in: #d5d9e3;
  --tx: #161a23;
  --body: #3d4350;
  --mut: #5a6170;
  --gold: #f6edd9;
  --goldt: #6e4c0e;
  --ok: #1e7a4c;
  --bad: #c8352e;
  --tag: #eef0f4;
  --on: #fff;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --pri: #6c93db;
    --soft: #1f2a40;
    --bg: #0f1420;
    --card: #1a2132;
    --bd: #2c3850;
    --in: #3a4660;
    --tx: #f2f4f8;
    --body: #d0d6e2;
    --mut: #a3acbf;
    --gold: #3a2f14;
    --goldt: #f0d79a;
    --tag: #262f44;
    --on: #0f1420;
  }
}
:root[data-theme="dark"] {
  --pri: #6c93db;
  --soft: #1f2a40;
  --bg: #0f1420;
  --card: #1a2132;
  --bd: #2c3850;
  --in: #3a4660;
  --tx: #f2f4f8;
  --body: #d0d6e2;
  --mut: #a3acbf;
  --gold: #3a2f14;
  --goldt: #f0d79a;
  --tag: #262f44;
  --on: #0f1420;
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  height: 100%;
}
body {
  background: var(--bg);
  color: var(--body);
  font-family: "Plus Jakarta Sans", system-ui, sans-serif;
  font-size: 14px;
}
#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100%;
  background: var(--bg);
  padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
}
h1,
h2,
h3 {
  color: var(--tx);
  margin: 0;
}
h2 {
  font-size: 16px;
  margin: 18px 0 8px;
}
.hd {
  background: var(--card);
  padding: 14px 16px;
  display: flex;
  gap: 10px;
  align-items: center;
  border-bottom: 1px solid var(--bd);
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
}
.hd h1 {
  font-size: 17px;
}
.hd small {
  display: block;
  color: var(--mut);
  font-size: 12px;
  margin-top: 2px;
}
.pad {
  padding: 0 16px;
}
.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 10px;
}
button {
  font: inherit;
  cursor: pointer;
  min-height: 44px;
  border-radius: 12px;
  border: 1px solid var(--in);
  background: var(--card);
  color: var(--tx);
  padding: 0 14px;
  font-weight: 600;
}
.pri {
  background: var(--pri);
  color: var(--on);
  border-color: var(--pri);
}
.sft {
  background: var(--soft);
  border-color: var(--soft);
  color: var(--pri);
}
.back {
  width: 44px;
  padding: 0;
  font-size: 20px;
}
.full {
  width: 100%;
}
.chip {
  border-radius: 99px;
  min-height: 44px;
  padding: 0 14px;
  margin: 0 6px 8px 0;
}
.chip.on {
  background: var(--pri);
  color: var(--on);
  border-color: var(--pri);
}
.tag {
  display: inline-block;
  background: var(--tag);
  color: var(--body);
  border-radius: 99px;
  padding: 3px 10px;
  font-size: 12px;
  font-weight: 600;
  margin: 0 4px 4px 0;
}
.gold {
  background: var(--gold);
  color: var(--goldt);
}
.row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.row > .g {
  flex: 1;
  min-width: 0;
}
.av {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--soft);
  color: var(--pri);
  display: grid;
  place-items: center;
  font-weight: 700;
  flex: none;
}
.av.l {
  width: 88px;
  height: 88px;

.ban {

.mut {
  color: var(--mut);

}
.b {

  color: var(--tx);

input[type="search"],
textarea,
select {

  background: var(--card);
  color: var(--tx);
  min-height: 44px;
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.bar {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 0;
  width: 100%;
  max-width: 480px;
  background: var(--card);
  border-top: 1px solid var(--bd);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  z-index: 6;
}
.nav {
  display: flex;
  padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0px));
}
.nav button {
  flex: 1;
  border: 0;
  background: none;
  color: var(--mut);
  font-size: 11px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-weight: 500;
}
.nav button.on {
  color: var(--pri);
  font-weight: 800;
}
.nav svg {
  width: 22px;
  height: 22px;
  stroke: currentColor;
  fill: none;

}
.call {
  background: #0f1420;
  color: #b8c0d0;
  min-height: 100vh;
}
.call .hd {
  background: #0f1420;
  border-color: #2c3850;
}
.call h1 {
  color: #fff;
}
.vid {

  place-items: center;
  text-align: center;
  padding: 12px;
}
.me {
  position: absolute;
  right: 10px;
  bottom: 10px;
  width: 80px;
  height: 100px;
  background: #2c3850;
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-size: 11px;
}
.pill {
  background: #2c3850;
  color: #fff;
  border-radius: 99px;
  padding: 5px 12px;

.em {

  height: 44px;

  padding: 0;
  font-size: 20px;
}
.em.on {

}
.sw {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
}
.sw button {
  flex: 1;
}
/* Home screen: hero + two boxes (see wireframe) */
.hero {
  background: linear-gradient(135deg, #1e3a6e, #4a6fb5);
  color: #fff;
  border-radius: 18px;
  padding: 28px 24px;
  margin: 16px 0;
}
.hero h1 {
  color: #fff;
  font-size: 28px;
  margin: 4px 0 8px;
}
.hero p {
  margin: 0 0 18px;

}
.hero button {
  background: #fff;
  color: #1e3a6e;
  border: 0;
  min-height: 48px;
  padding: 0 24px;
}
.home-cols {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}
.home-cols .card {
  margin-bottom: 0;
}
.stack {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.span-all {
  grid-column: 1 / -1;
}
.groups {
  display: grid;
  grid-template-columns: 1fr;
  column-gap: 32px;
}

/* Home screen: three boxes under the hero (Friends | Mentor | Upcoming) */
.home-trio {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}
.home-trio .card {

  background: var(--tag);
  border-radius: 99px;

.meter > div {
  height: 100%;
  background: var(--pri);
  border-radius: 99px;

  #app.wn .mb {
    left: 32px !important;

  }
  .bar:not(.side) {
    left: 0;
    transform: none;
    max-width: none;
    width: 100%;
    padding-left: 32px;
    padding-right: 32px;
  }
  .bar:not(.side) > * {
    display: block;
    max-width: 936px;
    margin-left: auto;
    margin-right: auto;
  }
  .vid {
    height: 400px;
  }
  .call > * {
    max-width: 960px;
    margin-left: auto;
    margin-right: auto;
  }
}
</style>

    <script>
// state.js — App state (appState) and small helpers: DOM lookup, initials, date and slot helpers.

// Transcription consent flow during a call
const CONSENT = {
  NONE: 0, // transcription off
  WAITING_FOR_MENTOR: 1, // mentee agreed, waiting for the mentor
  BOTH_AGREED: 2, // both agreed, transcript running
};

const SESSION_SECONDS = 30 * 60;

const appState = {
  screen: "profile",
  userId: null,
  accountType: null,
  sessionUser: null,

  // Friends
  friends: new Set([1, 2, 3, 4]), // ids of accepted mentee friends
  sentRequests: new Set(), // ids we've sent a friend request to
  incomingRequests: [5, 6], // ids who've sent us a friend request
  reactions: {}, // menteeId -> emoji we sent them
  suggestionScope: "all", // home "Add a friend" filter: "all" | "same" | "other" parish
  suggestionYear: 0, // home "Add a friend" filter: 0 = any level, 1-4 (4 = 4+)
  fellowshipGroups: new Set(), // ids of fellowship groups we've created

  // Formation journey
  journeyYear: 1, // which year tab is showing
  completedItems: new Set(), // keys from makeItemKey(year, item)

  // Booking a mentor session
  mentorId: null,
  selectedDayIndex: null, // index into upcomingDays
  selectedTime: null,
  topics: [],
  bookingNote: "", // note to the mentor, written while booking
  inviteAccepted: false,

  // Live call
  sessionNotes: "", // private notes taken during the call
  consentLevel: CONSENT.NONE,
  callTab: 0, // 0 = My notes, 1 = Transcript
  hadTranscript: false,
  secondsLeft: SESSION_SECONDS,
  timerInterval: null,
  sessionCount: 0, // completed mentor sessions

  // Filters, search, library
  parishFilter: "",
  ageFilter: "",
  skillFilter: "",
  searchQuery: "",
  openLibraryCategory: null,

  // Login / register form fields
  loginEmail: "",
  loginPassword: "",
  regEmail: "",
  regPassword: "",
  regName: "",
  regAccountType: "mentee",
  regParish: "ig",
  regAge: "20s",
};

const querySelector = (selector) => document.querySelector(selector);

const getInitials = (fullName) =>
  fullName
    .split(" ")
    .map((word) => word[0])
    .join("");

const getMentee = (menteeId) => menteeDirectory.find((mentee) => mentee.id === Number(menteeId));
const getMentor = (mentorId) => mentorDirectory.find((mentor) => mentor.id === Number(mentorId));

// The next 5 weekdays (skipping Saturdays and Sundays), starting from tomorrow
const upcomingDays = [];
{
  const MS_PER_DAY = 864e5;
  let currentDate = new Date();
  while (upcomingDays.length < 5) {
    currentDate = new Date(currentDate.getTime() + MS_PER_DAY);
    const isWeekday = currentDate.getDay() % 6 !== 0; // 0 = Sunday, 6 = Saturday
    if (isWeekday) upcomingDays.push(new Date(currentDate));
  }
}

const formatDayLabel = (date) =>
  date.toLocaleDateString("en-SG", {
    weekday: "short",
    day: "numeric",
    month: "short",
  });

const timeSlots = ["7:00 PM", "7:30 PM", "8:00 PM", "8:30 PM"];

// Placeholder rule for demo purposes: a slot is "booked" when the three numbers sum to a multiple of 5
const isSlotBooked = (mentorId, dayIndex, timeIndex) => (mentorId + dayIndex + timeIndex) % 5 === 0;

// Current user, read from the cached session so it stays consistent
const getCurrentUser = () => {
  if (!appState.sessionUser) return null;
  const user = appState.sessionUser;
  return {
    id: user.id,
    name: user.name,
    parish: user.parish,
    age: user.age,
    year: user.year, // mentees: formation year
    yearsServing: user.yearsServing, // mentors: years as a catechist
  };
};

// Mentees the user could befriend, filtered by the home-screen controls (own parish first)
const getSuggestedFriends = () => {
  const user = getCurrentUser() || fallbackUser;
  return menteeDirectory
    .filter(
      (mentee) =>
        !appState.friends.has(mentee.id) &&
        !appState.incomingRequests.includes(mentee.id) &&
        (appState.suggestionScope === "all" ||
          (appState.suggestionScope === "same") === (mentee.parish === user.parish)) &&
        (!appState.suggestionYear || Math.min(mentee.year, 4) === appState.suggestionYear),
    )
    .sort((a, b) => Number(b.parish === user.parish) - Number(a.parish === user.parish));
};

// Fellowship groups worth starting, worked out from who is in the user's friend network
const getFellowshipRecommendations = () => {
  const user = getCurrentUser() || fallbackUser;
  const friendList = menteeDirectory.filter((mentee) => appState.friends.has(mentee.id));

  const parishGroups = Object.keys(parishNames)
    .map((parish) => ({
      id: `parish-${parish}`,
      name: `${parishNames[parish]} Fellowship`,
      description: parish === user.parish ? "Friends from your own parish" : "Friends from this parish",
      members: friendList.filter((mentee) => mentee.parish === parish),
      isOwnParish: parish === user.parish,
    }))
    .filter((group) => group.members.length >= 2);

  const ownParishGroups = parishGroups.filter((group) => group.isOwnParish);
  const otherParishGroups = parishGroups.filter((group) => !group.isOwnParish);

  const yearGroups = [];
  if (user.year) {
    const level = Math.min(user.year, 4);
    const peers = friendList.filter((mentee) => Math.min(mentee.year, 4) === level);
    if (peers.length >= 2) {
      yearGroups.push({
        id: `year-${level}`,
        name: `Year ${level}${level === 4 ? "+" : ""} Circle`,
        description: "Peers at the same stage of formation",
        members: peers,
      });
    }
  }

  const crossParishGroups = [];
  const outsideParish = friendList.filter((mentee) => mentee.parish !== user.parish);
  if (outsideParish.length >= 2) {
    crossParishGroups.push({
      id: "cross-parish",
      name: "Across Parishes",
      description: "Catechists from different parishes",
      members: outsideParish,
    });
  }

  return [...ownParishGroups, ...yearGroups, ...crossParishGroups, ...otherParishGroups].slice(0, 3);
};

// auth.js — Authentication module: login, register, logout, session management.
const AUTH = {
  SESSION_KEY: "auth.session",
  ACCOUNTS_KEY: "auth.accounts",

  // Initialize auth on first load: seed demo accounts if none exist
  initAuth() {
    if (!localStorage.getItem(this.ACCOUNTS_KEY)) {
      this.seedDemoAccounts();
    }
  },

  // Get current session from localStorage, or null if no active session
  getSession() {
    const savedSession = localStorage.getItem(this.SESSION_KEY);
    return savedSession ? JSON.parse(savedSession) : null;
  },

  // Set session in localStorage
  setSession(userId, accountType, user) {
    const session = { userId, accountType, user };
    localStorage.setItem(this.SESSION_KEY, JSON.stringify(session));
    return session;
  },

  // Clear session
  logout() {
    localStorage.removeItem(this.SESSION_KEY);
  },

  // Get all stored accounts (keyed by lowercase email)
  getAccounts() {
    const savedAccounts = localStorage.getItem(this.ACCOUNTS_KEY);
    return savedAccounts ? JSON.parse(savedAccounts) : {};
  },

  // Store accounts
  setAccounts(accounts) {
    localStorage.setItem(this.ACCOUNTS_KEY, JSON.stringify(accounts));
  },

  // The public-facing user object kept in the session (no password)
  toSessionUser(account) {
    return {
      id: account.id,
      name: account.name,
      email: account.email,
      accountType: account.accountType,
      parish: account.parish,
      age: account.age,
      year: account.year,
      yearsServing: account.yearsServing,
      skills: account.skills,
    };
  },

  // Login with email and password
  login(email, password) {
    const accounts = this.getAccounts();
    const account = accounts[email.toLowerCase()];
    if (!account) return { error: "Email not found" };
    if (account.password !== password) return { error: "Password incorrect" };

    return this.setSession(account.id, account.accountType, this.toSessionUser(account));
  },

  // Register a new account
  register(email, password, name, accountType, details) {
    const emailLower = email.toLowerCase();
    const accounts = this.getAccounts();

    // Validation
    if (accounts[emailLower]) return { error: "Email already exists" };
    if (password.length < 6) return { error: "Password must be at least 6 characters" };
    if (!name || !accountType) return { error: "Name and account type required" };

    // Create new account
    const account = {
      id: Math.floor(Math.random() * 10000),
      email: emailLower,
      password,
      name,
      accountType,
      parish: details.parish || "ig",
      age: details.age || "20s",
      year: details.year || 1,
      yearsServing: details.yearsServing || 1,
      skills: details.skills || [],
    };

    accounts[emailLower] = account;
    this.setAccounts(accounts);

    // Auto-login
    return this.setSession(account.id, accountType, this.toSessionUser(account));
  },

  // Seed demo accounts on first load
  seedDemoAccounts() {
    const accounts = {};

    seedMentees().forEach((mentee) => {
      const email = mentee.email.toLowerCase();
      accounts[email] = {
        id: mentee.id,
        email,
        password: mentee.password,
        name: mentee.name,
        accountType: "mentee",
        parish: mentee.parish,
        age: mentee.age,
        year: mentee.year,
        yearsServing: undefined,
        skills: [],
      };
    });

    seedMentors().forEach((mentor) => {
      const email = mentor.email.toLowerCase();
      accounts[email] = {
        id: mentor.id,
        email,
        password: mentor.password,
        name: mentor.name,
        accountType: "mentor",
        parish: mentor.parish,
        age: mentor.age,
        year: undefined,
        yearsServing: mentor.yearsServing,
        skills: mentor.skills,
      };
    });

    const admin = seedAdmin();
    const adminEmail = admin.email.toLowerCase();
    accounts[adminEmail] = {
      id: admin.id,
      email: adminEmail,
      password: admin.password,
      name: admin.name,
      accountType: "admin",
      parish: admin.parish,
      age: undefined,
      year: undefined,
      yearsServing: undefined,
      skills: [],
    };

    this.setAccounts(accounts);
  },
};
</script>

<h2>Note for your mentor (optional)</h2><textarea rows="3" id="note" aria-label="Note">${appState.bookingNote}</textarea></div>

<div class="card" style="text-align:left"><div class="b">${formatDayLabel(upcomingDays[appState.selectedDayIndex])} · ${appState.selectedTime}</div><div class="mut">Video call · 30 min</div><div style="margin-top:6px">${appState.topics.map((topic) => `<span class="tag">${topic}</span>`).join("")}</div></div>
${appState.inviteAccepted ? "" : `<button class="sft full" style="margin-bottom:8px" data-a="acceptInvite">${mentor.name} accepts (demo)</button>`}<button class="pri full" style="margin-bottom:8px" data-a="startCall">Join session (demo)</button><button class="full" data-a="go" data-v="home">Back to home</button></div>`;

${consentLevel === CONSENT.BOTH_AGREED ? '<div class="pill" style="margin:10px 16px 0;display:inline-block;color:#ff8a80">● Transcribing · both of you agreed</div>' : ""}

</script>
    <script>
// app.js — Router/renderer renderApp(), live search, toasts and the global click/change handlers (data-a actions).

// Which nav item to highlight on screens that show the side nav
const navHighlightByScreen = {
  journey: "journey",
  mprof: "mentors",
  book: "mentors",
  sent: "mentors",
  take: "mentors",
};

const formatTimeLeft = (totalSeconds) =>
  `${Math.floor(totalSeconds / 60)}:${String(totalSeconds % 60).padStart(2, "0")} left`;

let lastRenderedScreen = null;

function renderApp() {
  const { screen } = appState;
  const app = querySelector("#app");

  clearInterval(appState.timerInterval);
  app.innerHTML = screenViews[screen]();

  if (navHighlightByScreen[screen]) {
    app.insertAdjacentHTML(
      "beforeend",
      renderNav(appState.accountType || "mentee", navHighlightByScreen[screen], true),
    );
  }
  app.className = querySelector("#app .side") ? "wn" : "";
  if (screen !== lastRenderedScreen) scrollTo(0, 0);
  lastRenderedScreen = screen;

  if (screen === "find") {
    const searchInput = querySelector("#q");
    searchInput.oninput = () => {
      appState.searchQuery = searchInput.value;
      updateSearchResults();
    };
    updateSearchResults();
  }

  if (screen === "call") {
    const updateTimerDisplay = () => {
      const timerDisplay = querySelector("#tm");
      if (timerDisplay) timerDisplay.textContent = formatTimeLeft(appState.secondsLeft);
    };
    updateTimerDisplay();
    appState.timerInterval = setInterval(() => {
      appState.secondsLeft = Math.max(0, appState.secondsLeft - 1);
      updateTimerDisplay();
    }, 1000);

    const notesInput = querySelector("#notes");
    if (notesInput) notesInput.oninput = (event) => (appState.sessionNotes = event.target.value);
  }

  if (screen === "book") {
    querySelector("#note").oninput = (event) => (appState.bookingNote = event.target.value);
  }

  if (screen === "login") {
    const emailInput = querySelector("#loginEmail");
    const passwordInput = querySelector("#loginPassword");
    if (emailInput) emailInput.oninput = (event) => (appState.loginEmail = event.target.value);
    if (passwordInput) passwordInput.oninput = (event) => (appState.loginPassword = event.target.value);
  }

  if (screen === "register") {
    const nameInput = querySelector("#regName");
    const emailInput = querySelector("#regEmail");
    const passwordInput = querySelector("#regPassword");
    const accountTypeSelect = querySelector("#regAccountType");
    const parishSelect = querySelector("#regParish");
    const ageSelect = querySelector("#regAge");
    if (nameInput) nameInput.oninput = (event) => (appState.regName = event.target.value);
    if (emailInput) emailInput.oninput = (event) => (appState.regEmail = event.target.value);
    if (passwordInput) passwordInput.oninput = (event) => (appState.regPassword = event.target.value);
    if (accountTypeSelect) accountTypeSelect.onchange = (event) => (appState.regAccountType = event.target.value);
    if (parishSelect) parishSelect.onchange = (event) => (appState.regParish = event.target.value);
    if (ageSelect) ageSelect.onchange = (event) => (appState.regAge = event.target.value);
  }
}

function updateSearchResults() {
  const query = appState.searchQuery.toLowerCase();
  const results = menteeDirectory.filter(
    (mentee) =>
      mentee.name.toLowerCase().includes(query) || parishNames[mentee.parish].toLowerCase().includes(query),
  );

  querySelector("#res").innerHTML =
    `<div class="mut" style="margin:10px 0">${results.length} mentees found · They'll need to accept your request</div>` +
    results
      .map((mentee) => {
        const isFriend = appState.friends.has(mentee.id);
        const isRequested = appState.sentRequests.has(mentee.id);
        const buttonClass = isFriend ? "" : isRequested ? "sft" : "pri";
        const buttonLabel = isFriend ? "Friends" : isRequested ? "Requested" : "Add";
        return `<div class="card row">${renderAvatar(mentee.name)}<div class="g"><div class="b">${mentee.name}</div><div class="mut">${parishNames[mentee.parish]} · Year ${mentee.year}</div></div><button class="${buttonClass}" ${isFriend ? "disabled" : ""} data-a="toggleFriendRequest" data-v="${mentee.id}">${buttonLabel}</button></div>`;
      })
      .join("");
}

function showToast(message) {
  const toast = document.createElement("div");
  toast.textContent = message;
  toast.style.cssText =
    "position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--pri);color:var(--on);padding:10px 16px;border-radius:99px;z-index:20;font-weight:600;pointer-events:none";
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 1800);
}

// <select> and checkbox actions
document.addEventListener("change", (event) => {
  const target = event.target.closest("[data-a]");
  if (!target) return;

  const changeActions = {
    filterParish: () => {
      appState.parishFilter = target.value;
      renderApp();
    },
    filterAge: () => {
      appState.ageFilter = target.value;
      renderApp();
    },
    toggleCourseItem: () => {
      const itemKey = target.dataset.v;
      target.checked ? appState.completedItems.add(itemKey) : appState.completedItems.delete(itemKey);
      renderApp();
    },
  };
  changeActions[target.dataset.a]?.();
});

// Button actions
document.addEventListener("click", (event) => {
  const target = event.target.closest("[data-a]");
  if (!target || target.tagName === "SELECT" || target.type === "checkbox") return;

  const action = target.dataset.a;
  const value = target.dataset.v;

  const goToScreen = (screen) => {
    appState.screen = screen;
    renderApp();
  };

  const clickActions = {
    go: () => {
      if (value === "book") {
        appState.selectedDayIndex = null;
        appState.selectedTime = null;
      }
      goToScreen(value);
    },

    comingSoon: () => showToast("Coming soon"),

    // --- Auth ---
    login: () => {
      if (!appState.loginEmail || !appState.loginPassword) {
        showToast("Please enter email and password");
        return;
      }
      const result = AUTH.login(appState.loginEmail, appState.loginPassword);
      if (result.error) {
        showToast(result.error);
        return;
      }
      appState.userId = result.userId;
      appState.accountType = result.accountType;
      appState.sessionUser = result.user;
      appState.screen = "home";
      appState.loginEmail = "";
      appState.loginPassword = "";
      renderApp();
    },
    register: () => {
      if (!appState.regName || !appState.regEmail || !appState.regPassword) {
        showToast("Please fill in all fields");
        return;
      }
      const result = AUTH.register(appState.regEmail, appState.regPassword, appState.regName, appState.regAccountType, {
        parish: appState.regParish,
        age: appState.regAge,
      });
      if (result.error) {
        showToast(result.error);
        return;
      }
      appState.userId = result.userId;
      appState.accountType = result.accountType;
      appState.sessionUser = result.user;
      appState.regName = "";
      appState.regEmail = "";
      appState.regPassword = "";
      appState.regAccountType = "mentee";
      appState.regParish = "ig";
      appState.regAge = "20s";
      appState.screen = "home";
      renderApp();
      showToast("Account created!");
    },
    confirmLogout: () => {
      AUTH.logout();
      appState.userId = null;
      appState.accountType = null;
      appState.sessionUser = null;
      appState.screen = "login";
      renderApp();
      showToast("Logged out");
    },

    // --- Formation journey ---
    selectYear: () => {
      appState.journeyYear = +value;
      renderApp();
    },

    // --- Friends ---
    toggleFriendRequest: () => {
      const menteeId = +value;
      if (appState.sentRequests.has(menteeId)) {
        appState.sentRequests.delete(menteeId);
      } else {
        appState.sentRequests.add(menteeId);
        showToast("Request sent");
      }
      if (appState.screen === "find") updateSearchResults();
      else renderApp();
    },
    acceptFriend: () => {
      const menteeId = +value;
      appState.incomingRequests = appState.incomingRequests.filter((id) => id !== menteeId);
      appState.friends.add(menteeId);
      renderApp();
    },
    declineFriend: () => {
      appState.incomingRequests = appState.incomingRequests.filter((id) => id !== +value);
      renderApp();
    },
    sendReaction: () => {
      const [menteeId, emoji] = value.split("|");
      appState.reactions[menteeId] = emoji;
      showToast("Sent " + emoji);
      renderApp();
    },

    setSuggestionScope: () => {
      appState.suggestionScope = value;
      renderApp();
    },
    setSuggestionYear: () => {
      appState.suggestionYear = +value;
      renderApp();
    },
    findPeersAtLevel: () => {
      appState.suggestionScope = "all";
      appState.suggestionYear = +value;
      renderApp();
      querySelector("#suggestions")?.scrollIntoView({ behavior: "smooth", block: "center" });
    },
    createFellowshipGroup: () => {
      const group = getFellowshipRecommendations().find((candidate) => candidate.id === value);
      if (!group) return;
      appState.fellowshipGroups.add(group.id);
      showToast(`${group.name} created — invites sent`);
      renderApp();
    },

    // --- Library ---
    toggleLibraryCategory: () => {
      appState.openLibraryCategory = appState.openLibraryCategory === value ? null : value;
      renderApp();
    },

    // --- Finding and booking a mentor ---
    selectSkill: () => {
      appState.skillFilter = value;
      renderApp();
    },
    viewMentor: () => {
      appState.mentorId = +value;
      goToScreen("mprof");
    },
    selectDate: () => {
      appState.selectedDayIndex = +value;
      appState.selectedTime = null;
      renderApp();
    },
    selectTime: () => {
      appState.selectedTime = value;
      renderApp();
    },
    toggleTopic: () => {
      // Keep at most the 2 most recently picked topics
      appState.topics = appState.topics.includes(value)
        ? appState.topics.filter((topic) => topic !== value)
        : [...appState.topics, value].slice(-2);
      renderApp();
    },
    sendInvite: () => {
      appState.inviteAccepted = false;
      goToScreen("sent");
    },
    acceptInvite: () => {
      appState.inviteAccepted = true;
      renderApp();
    },

    // --- Live call ---
    startCall: () => {
      appState.secondsLeft = SESSION_SECONDS;
      appState.consentLevel = CONSENT.NONE;
      appState.callTab = 0;
      appState.sessionNotes = "";
      goToScreen("call");
    },
    toggleMic: () => {
      target.textContent = target.textContent === "Mic on" ? "Mic off" : "Mic on";
    },
    toggleCamera: () => {
      target.textContent = target.textContent === "Camera on" ? "Camera off" : "Camera on";
    },
    selectCallTab: () => {
      appState.callTab = +value;
      renderApp();
    },
    cancelConsent: () => {
      appState.consentLevel = CONSENT.NONE;
      renderApp();
    },
    requestConsent: () => {
      appState.consentLevel = CONSENT.WAITING_FOR_MENTOR;
      renderApp();
    },
    grantMentorConsent: () => {
      appState.consentLevel = CONSENT.BOTH_AGREED;
      appState.hadTranscript = true;
      renderApp();
    },
    endSession: () => {
      appState.sessionCount += 1;
      goToScreen("take");
    },
    bookAgain: () => {
      appState.selectedDayIndex = null;
      appState.selectedTime = null;
      appState.topics = [];
      appState.bookingNote = "";
      goToScreen("book");
    },
  };

  clickActions[action]?.();
});

// Initialize auth on page load
AUTH.initAuth();
const savedSession = AUTH.getSession();
if (savedSession) {
  appState.userId = savedSession.userId;
  appState.accountType = savedSession.accountType;
  appState.sessionUser = savedSession.user;
  appState.screen = "home";
} else {
  appState.screen = "login";
}
renderApp();
</script>
  </body>
</html>
