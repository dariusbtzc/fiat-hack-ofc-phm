<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Friend Network</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrap">
      <h1>Friends</h1>
      <p class="sub">Find people, send requests and manage your connections.</p>
      <div class="tabs" role="tablist" id="tabs">
        <button role="tab" data-t="friends">Friends</button>
        <button role="tab" data-t="requests">Requests</button>
        <button role="tab" data-t="sent">Sent</button>
        <button role="tab" data-t="discover">Find people</button>
      </div>
      <input
        id="q"
        type="search"
        placeholder="Search by name"
        aria-label="Search by name"
      />
      <div class="list" id="list"></div>
    </div>
    <div id="toast" role="status"></div>

    <script src="app.js"></script>
  </body>
</html>
